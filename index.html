<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HACKED</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#000;color:#00ff66;font-family:monospace;
  display:flex;align-items:center;justify-content:center;
}
canvas{position:fixed;inset:0;opacity:.28}
.scan{position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,255,90,.035) 4px);
}
.box{
  position:relative;text-align:center;padding:38px 28px;
  width:min(850px,90%);border:1px solid #00ff66;
  background:rgba(0,12,5,.78);
  box-shadow:0 0 25px #00ff66, inset 0 0 35px rgba(0,255,102,.08);
}
.badge{font-size:14px;letter-spacing:5px;margin-bottom:22px}
h1{
  margin:0;font-size:clamp(35px,8vw,80px);
  text-shadow:0 0 8px #00ff66,0 0 25px #00ff66;
  animation:glitch 1.7s infinite;
}
p{font-size:clamp(18px,3vw,28px);margin:22px 0 8px}
.sub{font-size:13px;opacity:.7;direction:ltr}
.cursor{display:inline-block;width:9px;height:1em;background:#00ff66;vertical-align:-2px;animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
@keyframes glitch{0%,92%,100%{transform:none}94%{transform:translate(3px,-2px)}96%{transform:translate(-3px,2px)}}
</style>
</head>
<body>
<canvas id="matrix"></canvas><div class="scan"></div>
<main class="box">
  <div class="badge">⚠ SYSTEM ALERT ⚠</div>
  <h1>تم اختراقك من قبل إياد</h1>
  <p>YOUR SYSTEM HAS BEEN COMPROMISED <span class="cursor"></span></p>
  <div class="sub">[ DEMO PAGE — NO REAL HACKING ]</div>
</main>
<script>
const c=document.getElementById('matrix'),x=c.getContext('2d');
let fs=16, cols, drops;
function resize(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/fs);drops=Array(cols).fill(1)}
resize(); addEventListener('resize',resize);
function draw(){
 x.fillStyle='rgba(0,0,0,.08)';x.fillRect(0,0,c.width,c.height);
 x.fillStyle='#00ff66';x.font=fs+'px monospace';
 for(let i=0;i<drops.length;i++){
   const t=String.fromCharCode(0x30A0+Math.random()*96);
   x.fillText(t,i*fs,drops[i]*fs);
   if(drops[i]*fs>c.height&&Math.random()>.975)drops[i]=0;
   drops[i]++;
 }
}
setInterval(draw,45);
</script>
</body>
</html>
